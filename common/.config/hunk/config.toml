# Hunk user config — https://www.hunk.dev/docs/reference/config/
# Only the keys I want to change; the defaults cover the rest.

theme = "catppuccin-macchiato"
mode = "auto"           # split/stack based on width
line_numbers = true
tab_width = 2           # consistent with most repos
hunk_headers = true

# Pager-style sessions (git diff / git show via core.pager = "hunk pager")
[pager]
menu_bar = false
