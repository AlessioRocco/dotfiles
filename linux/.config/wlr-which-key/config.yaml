font: GeistMono Nerd Font Mono 12
background: "#1e1e2e"
color: "#ffffff"
border: "#b4befe"
padding: 12
border_width: 1
corner_r: 8

anchor: bottom-right
margin_right: 12
margin_bottom: 12

menu:
  - key: "p"
    desc: Power
    cmd: system-action session menu-toggle
  - key: "a"
    desc: Apps
    submenu:
      - key: "b"
        desc: Google Chrome
        cmd: focus-or-launch google-chrome google-chrome-stable
      - key: "t"
        desc: Telegram
        cmd: focus-or-launch org.telegram.desktop telegram-desktop
      - key: "m"
        desc: Gmail
        cmd: focus-or-launch chrome-fmgjjmmmlfnkbppncabfkddbjimcfncm-Profile_1 gtk-launch chrome-fmgjjmmmlfnkbppncabfkddbjimcfncm-Profile_1
      - key: "c"
        desc: Calendar
        cmd: focus-or-launch chrome-kjbdgfilnfhdoflbpgamdcdgpehopbep-Profile_1 gtk-launch chrome-kjbdgfilnfhdoflbpgamdcdgpehopbep-Profile_1
      - key: "e"
        desc: Google Meet
        cmd: focus-or-launch chrome-kjgfgldnnfoeklkmfkjfagphfepbbdan-Profile_1 gtk-launch chrome-kjgfgldnnfoeklkmfkjfagphfepbbdan-Profile_1
      - key: "s"
        desc: Slack
        cmd: focus-or-launch slack slack
      - key: "a"
        desc: Google Chat
        cmd: focus-or-launch chrome-pommaclcbfghclhalboakcipcmmndhcj-Profile_1 gtk-launch chrome-pommaclcbfghclhalboakcipcmmndhcj-Profile_1
      - key: "g"
        desc: GitHub
        cmd: focus-or-launch chrome-mjoklplbddabcmpepnokjaffbmgbkkgg-Profile_1 gtk-launch chrome-mjoklplbddabcmpepnokjaffbmgbkkgg-Profile_1
      - key: "j"
        desc: Jira
        cmd: focus-or-launch chrome-kdlkbchlgboeoomhlnbhmoieojblpnpo-Profile_1 gtk-launch chrome-kdlkbchlgboeoomhlnbhmoieojblpnpo-Profile_1
      - key: "u"
        desc: Spotify
        cmd: focus-or-launch Spotify spotify
      - key: "h"
        desc: Home Assistant
        cmd: focus-or-launch chrome-dfdefklgdndbkmlaebimhmdkdmncihkf-Default gtk-launch chrome-dfdefklgdndbkmlaebimhmdkdmncihkf-Default
  - key: "t"
    desc: Tools
    submenu:
      - key: "j"
        desc: Emoji Selector
        cmd: noctalia msg panel-open launcher /emo
      - key: "e"
        desc: File Manager
        cmd: quick_terminal yazi
      - key: "p"
        desc: Task Manager
        cmd: quick_terminal btop
      - key: "s"
        desc: Systemd Services
        cmd: quick_terminal systemctl-tui -s user
      - key: "n"
        desc: Night Light
        cmd: system-action nightlight toggle
      - key: "w"
        desc: Toggle WiFi
        cmd: system-action wifi toggle
      - key: "v"
        desc: Toggle Bluetooth
        cmd: system-action bluetooth toggle
      - key: "c"
        desc: Caffeine Toggle
        cmd: system-action idle toggle
      - key: "b"
        desc: Power Profile Cycle
        cmd: system-action power cycle
        keep_open: true
  - key: "s"
    desc: Screenshot
    submenu:
      - key: "f"
        desc: Full Screen
        cmd: system-action screenshot fullscreen
      - key: "r"
        desc: Region
        cmd: system-action screenshot region
      - key: "w"
        desc: Pick Monitor
        cmd: noctalia msg screenshot-fullscreen pick
  - key: "r"
    desc: Toggle Recording
    cmd: system-action screenrecord toggle
  - key: "y"
    desc: Clipboard History
    cmd: system-action clipboard toggle
  - key: "n"
    desc: Notifications
    submenu:
      - key: "c"
        desc: Clear Active
        cmd: system-action notifications clear-active
      - key: "x"
        desc: Clear History
        cmd: system-action notifications clear-history
      - key: "h"
        desc: Show History
        cmd: system-action notifications show-history
      - key: "d"
        desc: Toggle Do Not Disturb
        cmd: system-action notifications toggle-dnd
