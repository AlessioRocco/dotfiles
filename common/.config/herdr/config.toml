onboarding = false
[theme]
name = "terminal"
auto_switch = false

[ui.toast]
delivery = "herdr"

[ui]
agent_panel_sort = "spaces"
prompt_new_tab_name = false
sidebar_start_collapsed = true
sidebar_collapsed_mode = "hidden"

[experimental]
switch_ascii_input_source_in_prefix = true

[keys]
prefix = "ctrl+a"
settings = "prefix+,"
copy_mode = "prefix+enter"
new_worktree = ""

# Jump straight to the two spaces I live in. Workspace ids are per-session, so
# these go through a label lookup rather than a fixed index.
[[keys.command]]
key = "prefix+space"
type = "shell"
command = "herdr-open-space starship \"$HOME/starship\""
description = "Space: starship"

[[keys.command]]
key = "prefix+period"
type = "shell"
command = "herdr-open-space dotfiles \"$HOME/dotfiles\""
description = "Space: dotfiles"

[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "vim-herdr-navigation.left"
description = "navigate left (vim/herdr)"

[[keys.command]]
key = "ctrl+j"
type = "plugin_action"
command = "vim-herdr-navigation.down"
description = "navigate down (vim/herdr)"

[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "vim-herdr-navigation.up"
description = "navigate up (vim/herdr)"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "vim-herdr-navigation.right"
description = "navigate right (vim/herdr)"

[[keys.command]]
key = "prefix+shift+g"
type = "popup"
command = 'cd "$(herdr-worktree-current)" 2>/dev/null; exec lazygit'
width = "90%"
height = "90%"
description = "Git: lazygit on the current worktree"

[[keys.command]]
key = "prefix+shift+o"
type = "popup"
command = "gh dash"
width = "90%"
height = "90%"
description = "GitHub: dashboard"
