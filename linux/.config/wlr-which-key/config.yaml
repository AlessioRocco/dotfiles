font: GeistMono Nerd Font Mono 12
background: "#24273a"
color: "#cad3f5"
border: "#b7bdf8"
padding: 12
border_width: 1
corner_r: 8

anchor: bottom-right
margin_right: 12
margin_bottom: 12

menu:
  - key: "p"
    desc: Power
    submenu:
      - key: "l"
        desc: Lock
        cmd: system-action session lock
      - key: "u"
        desc: Suspend
        cmd: system-action session suspend
      - key: "r"
        desc: Reboot
        cmd: system-action session reboot
      - key: "s"
        desc: Shutdown
        cmd: system-action session shutdown
      - key: "o"
        desc: Logout
        cmd: loginctl terminate-user $USER
  - key: "a"
    desc: Apps
    submenu:
      - key: "b"
        desc: Google Chrome
        cmd: vicinae vicinae://launch/applications/google-chrome
      - key: "t"
        desc: Telegram
        cmd: runapp Telegram
      - key: "m"
        desc: Gmail
        cmd: vicinae vicinae://launch/applications/chrome-fmgjjmmmlfnkbppncabfkddbjimcfncm-Profile_1
      - key: "c"
        desc: Calendar
        cmd: vicinae vicinae://launch/applications/chrome-kjbdgfilnfhdoflbpgamdcdgpehopbep-Profile_1
      - key: "e"
        desc: Google Meet
        cmd: vicinae vicinae://launch/applications/chrome-kjgfgldnnfoeklkmfkjfagphfepbbdan-Profile_1
      - key: "s"
        desc: Slack
        cmd: vicinae vicinae://launch/applications/slack
      - key: "a"
        desc: Google Chat
        cmd: vicinae vicinae://launch/applications/chrome-pommaclcbfghclhalboakcipcmmndhcj-Profile_1
      - key: "g"
        desc: GitHub
        cmd: vicinae vicinae://launch/applications/chrome-mjoklplbddabcmpepnokjaffbmgbkkgg-Profile_1
      - key: "j"
        desc: Jira
        cmd: vicinae vicinae://launch/applications/chrome-kdlkbchlgboeoomhlnbhmoieojblpnpo-Profile_1
      - key: "u"
        desc: Spotify
        cmd: vicinae vicinae://launch/applications/spotify
      - key: "h"
        desc: Home Assistant
        cmd: vicinae vicinae://launch/applications/chrome-dfdefklgdndbkmlaebimhmdkdmncihkf-Default
  - key: "t"
    desc: Tools
    submenu:
      - key: "e"
        desc: File Manager
        cmd: quick_terminal yazi
      - key: "p"
        desc: Task Manager
        cmd: quick_terminal btop
      - key: "s"
        desc: Systemd Services
        cmd: quick_terminal systemctl-tui -s user
      - key: "a"
        desc: Audio Mixer
        cmd: quick_terminal pulsemixer
      - key: "b"
        desc: Bluetooth
        cmd: quick_terminal bluetui
      - key: "n"
        desc: Network
        submenu:
          - key: "w"
            desc: WiFi (impala)
            cmd: quick_terminal impala
          - key: "n"
            desc: Connection Editor
            cmd: nm-connection-editor
      - key: "i"
        desc: Toggle Idle
        cmd: system-action idle toggle
      - key: "r"
        desc: Power Profile
        submenu:
          - key: "p"
            desc: Performance
            cmd: powerprofilesctl set performance
          - key: "b"
            desc: Balanced
            cmd: powerprofilesctl set balanced
          - key: "s"
            desc: Power Saver
            cmd: powerprofilesctl set power-saver
      - key: "w"
        desc: Emoji Selector
        cmd: vicinae vicinae://extensions/vicinae/core/search-emojis
  - key: "s"
    desc: Screenshot
    submenu:
      - key: "f"
        desc: Full Screen
        cmd: system-action screenshot fullscreen
      - key: "r"
        desc: Region
        cmd: system-action screenshot region
      - key: "w"
        desc: Pick Monitor
        cmd: screenshot fullscreen
  - key: "r"
    desc: Record Screen
    submenu:
      - key: "r"
        desc: Start Recording
        cmd: system-action screenrecord start
      - key: "s"
        desc: Stop Recording
        cmd: system-action screenrecord stop
  - key: "n"
    desc: Notifications
    submenu:
      - key: "c"
        desc: Clear All
        cmd: system-action notifications clear-active
      - key: "d"
        desc: Toggle DND
        cmd: system-action notifications toggle-dnd
      - key: "i"
        desc: Toggle Idle
        cmd: system-action idle toggle
