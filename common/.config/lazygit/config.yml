gui:
  nerdFontsVersion: "3"
os:
  editPreset: "nvim-remote"
git:
  overrideGpg: true
  diffRenderers:
    - colorArg: always
      command: delta --dark --paging=never --line-numbers --hyperlinks --hyperlinks-file-link-format="lazygit-edit://{path}:{line}"
customCommands:
  - key: "n"
    command: 'wt -C "{{.SelectedWorktree.Path}}" switch --create --no-cd --base @ "{{index .PromptResponses 0}}"; and kill (ps -o ppid= -p %self | string trim)'
    context: "worktrees"
    description: "Worktrunk: create worktree from selected, closing this popup"
    output: terminal
    prompts:
      - type: input
        title: "New branch name"
        key: Branch
  - key: "<space>"
    command: 'wt switch --no-cd "{{.SelectedWorktree.Branch}}"; and kill (ps -o ppid= -p %self | string trim)'
    context: "worktrees"
    description: "Worktrunk: open in herdr, closing this popup"
    output: terminal
  - key: "W"
    command: 'wt switch --no-cd "{{.SelectedRemoteBranch.Name}}"; and kill (ps -o ppid= -p %self | string trim)'
    context: "remoteBranches"
    description: "Worktrunk: create worktree from remote branch, closing this popup"
    output: terminal
  - key: "d"
    command: 'set -e GIT_DIR GIT_WORK_TREE; set primary (git -C "{{.SelectedWorktree.Path}}" worktree list --porcelain | head -1 | string replace "worktree " ""); and wt remove --foreground -C "$primary" "{{.SelectedWorktree.Path}}"'
    context: "worktrees"
    description: "Worktrunk: remove worktree"
    output: terminal
    prompts:
      - type: confirm
        title: "Remove worktree"
        body: "Remove '{{.SelectedWorktree.Branch}}'?"
