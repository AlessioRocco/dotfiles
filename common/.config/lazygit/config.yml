git:
  overrideGpg: true
  pagers:
    - colorArg: always
      pager: delta --dark --paging=never --line-numbers --hyperlinks --hyperlinks-file-link-format="lazygit-edit://{path}:{line}"
customCommands:
  - key: "n"
    command: 'bash -c ''path=$(wt -C "{{.SelectedWorktree.Path}}" switch --create --no-cd --base @ --format json "{{index .PromptResponses 0}}" | jq -r .path) && zoxide add "$path" && herdr-open-worktree "$path" "{{index .PromptResponses 0}}"'''
    context: "worktrees"
    description: "Worktrunk: create worktree from selected"
    output: terminal
    prompts:
      - type: input
        title: "New branch name"
        key: Branch
  - key: "<space>"
    command: "herdr-open-worktree '{{.SelectedWorktree.Path}}' '{{.SelectedWorktree.Branch}}'"
    context: "worktrees"
    description: "Worktrunk: open in herdr"
    output: terminal
  - key: "W"
    command: 'bash -c ''branch="{{.SelectedRemoteBranch.Name}}" && path=$(wt switch --no-cd --format json "$branch" | jq -r .path) && zoxide add "$path" && herdr-open-worktree "$path" "$branch"'''
    context: "remoteBranches"
    description: "Worktrunk: create worktree from remote branch"
    output: terminal
  - key: "d"
    command: "herdr-remove-worktree '{{.SelectedWorktree.Path}}'"
    context: "worktrees"
    description: "Worktrunk: remove worktree"
    output: terminal
    prompts:
      - type: confirm
        title: "Remove worktree"
        body: "Remove '{{.SelectedWorktree.Branch}}'?"
