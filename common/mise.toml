[tools]
ruby = "4.0.6"
node = "24"
dagu = "2.18.2"

# Service CLIs used across client projects (Jira, Heroku, Cloudflare).
acli = "latest"
heroku = "latest"
"npm:cf" = { version = "latest", prerelease = "true" }

# Google Workspace CLI (gws). Not in mise's registry, and AUR's `gws` is an
# unrelated git helper, so pull the release binary straight from GitHub.
"github:googleworkspace/cli" = "latest"
# `gws auth setup` shells out to gcloud to create the OAuth client.
gcloud = "latest"

[env]
# claude.ai connectors (Gmail, Slack, …) stay off in Claude Code by default;
# repos that need them set this to true in their own mise.toml.
ENABLE_CLAUDEAI_MCP_SERVERS = "false"
