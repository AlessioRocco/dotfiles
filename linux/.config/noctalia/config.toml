[nightlight]
enabled = true

[osd.kinds]
wifi = true

[plugin_settings."noctalia/screen_recorder"]
hide_inactive = true

[plugins]
enabled = [ "noctalia/screen_recorder" ]

[shell]
launch_apps_as_systemd_services = true

    [shell.greeter_sync]
    auto_sync = true

    [shell.launcher]
    categories = false
    compact = true

    [shell.panel]
    launcher_position = "auto"

    [shell.screenshot]
    annotate = true
    pipe_command = ""
    pipe_to_command = false
    save_to_file = false

    [[shell.session.actions]]
    action = "lock"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "l"
    variant = "default"

    [[shell.session.actions]]
    action = "logout"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "o"
    variant = "default"

    [[shell.session.actions]]
    action = "lock_and_suspend"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "u"
    variant = "default"

    [[shell.session.actions]]
    action = "reboot"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "r"
    variant = "default"

    [[shell.session.actions]]
    action = "shutdown"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "s"
    variant = "destructive"

[theme]
builtin = "Catppuccin"
community_palette = "Catppuccin Macchiato Lavender"
mode = "dark"
source = "builtin"
wallpaper_scheme = "m3-content"

    [theme.templates]
    builtin_ids = [ "gtk3", "gtk4", "hyprland", "qt" ]
    community_ids = [ "telegram" ]
    enable_builtin_templates = true
    enable_community_templates = true

[wallpaper.default]
path = "/home/alessio/Pictures/Wallpapers/nebulab.jpg"

[wallpaper.last]
path = "/home/alessio/Pictures/Wallpapers/nebulab.jpg"

[wallpaper.monitors.DP-1]
path = "/home/alessio/Pictures/Wallpapers/nebulab.jpg"

[wallpaper.monitors.DP-4]
path = "/home/alessio/Pictures/Wallpapers/nebulab.jpg"

[wallpaper.monitors.eDP-1]
path = "/home/alessio/Pictures/Wallpapers/nebulab.jpg"

[[wallpaper.favorite]]
builtin_palette = "Catppuccin"
palette_source = "builtin"
path = "/home/alessio/Pictures/Wallpapers/nebulab.jpg"
theme_mode = "dark"

[widget.cpu]
show_label = false

[widget.network]
show_label = false

[widget.network_rx]
show_label = false

[widget.network_tx]
show_label = false

[widget.privacy]
hide_inactive = true

[widget.ram]
show_label = false

[widget.recorder_2]
type = "noctalia/screen_recorder:recorder"

[widget.taskbar]
group_by_workspace = true
group_single_icon_per_app = true
hide_empty_workspaces = true
workspace_label_placement = "inside"

[widget.tray]
drawer = true

[widget.weather]
show_condition = false
