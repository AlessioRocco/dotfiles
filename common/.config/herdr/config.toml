onboarding = false
[theme]
name = "catppuccin"
auto_switch = false

[ui.toast]
delivery = "herdr"

[ui]
agent_panel_sort = "spaces"
prompt_new_tab_name = false
sidebar_start_collapsed = true
sidebar_collapsed_mode = "hidden"

[experimental]
switch_ascii_input_source_in_prefix = true

[keys]
prefix = "ctrl+a"
settings = "prefix+,"
copy_mode = "prefix+enter"

# Jump straight to the two spaces I live in. Workspace ids are per-session, so
# these go through a label lookup rather than a fixed index.
[[keys.command]]
key = "prefix+space"
type = "shell"
command = "herdr-open-space starship \"$HOME/starship\""
description = "Space: starship"

[[keys.command]]
key = "prefix+period"
type = "shell"
command = "herdr-open-space dotfiles \"$HOME/dotfiles\""
description = "Space: dotfiles"

[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "vim-herdr-navigation.left"
description = "navigate left (vim/herdr)"

[[keys.command]]
key = "ctrl+j"
type = "plugin_action"
command = "vim-herdr-navigation.down"
description = "navigate down (vim/herdr)"

[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "vim-herdr-navigation.up"
description = "navigate up (vim/herdr)"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "vim-herdr-navigation.right"
description = "navigate right (vim/herdr)"

[[keys.command]]
key = "prefix+shift+g"
type = "plugin_action"
command = "worktrunk.open"
description = "Worktree: switch / create from default branch"

# Optional: bind current-branch creation separately.
[[keys.command]]
key = "prefix+shift+c"
type = "plugin_action"
command = "worktrunk.open-current"
description = "Worktree: switch / create from current branch"

[[keys.command]]
key = "prefix+shift+d"
type = "plugin_action"
command = "worktrunk.remove"
description = "Worktree: remove"
