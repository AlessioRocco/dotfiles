[bar.default]
center = [ "taskbar", "privacy", "recorder_2" ]
end = [ "group:g3", "group:g1", "group:g2", "nightlight", "volume", "notifications", "group:g4", "session" ]
margin_edge = 5
margin_ends = 5
show_on_workspace_switch = false
start = [ "control-center", "tray", "active_window" ]

    [[bar.default.capsule_group]]
    accordion = false
    accordion_direction = "end"
    enabled = true
    fill = "surface_variant"
    id = "g1"
    members = [ "network", "bluetooth" ]
    opacity = 1.0
    padding = 6.0

    [[bar.default.capsule_group]]
    accordion = false
    accordion_direction = "end"
    enabled = true
    fill = "surface_variant"
    id = "g2"
    members = [ "battery", "power_profile", "caffeine" ]
    opacity = 1.0
    padding = 6.0

    [[bar.default.capsule_group]]
    accordion = false
    accordion_direction = "end"
    enabled = true
    fill = "surface_variant"
    id = "g3"
    members = [ "network_rx", "network_tx", "cpu", "ram" ]
    opacity = 1.0
    padding = 6.0

    [[bar.default.capsule_group]]
    accordion = false
    accordion_direction = "end"
    enabled = true
    fill = "surface_variant"
    id = "g4"
    members = [ "weather", "clock" ]
    opacity = 1.0
    padding = 6.0

[brightness]
enable_ddcutil = true

[calendar]
enabled = true

    [calendar.account.nebulab]
    name = "Nebulab"
    type = "google"

[dock]
enabled = false

[idle]
behavior_order = [ "Reduce Brightness", "Keyboard Brightness", "lock", "screen-off", "lock-and-suspend" ]

    [idle.behavior."Keyboard Brightness"]
    action = "command"
    command = "kbd_backlight 0"
    enabled = true
    timeout = 180.0

    [idle.behavior."Reduce Brightness"]
    action = "command"
    command = "brightnessctl -s set 10"
    enabled = true
    resume_command = "brightnessctl -r"
    timeout = 180.0

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 300.0

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    enabled = true
    timeout = 600.0

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = true
    timeout = 400.0

[location]
auto_locate = true

